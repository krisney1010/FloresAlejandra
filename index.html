<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un jardín de flores amarillas para ti</title>
<meta name="description" content="Tócalo para hacerlo florecer 🌻">
<meta property="og:title" content="🌻 Un jardín de flores amarillas para ti">
<meta property="og:description" content="Tócalo para hacerlo florecer.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#151b38">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#151b38;
    --ink:#2b2340;
    --paper:#fff8e6;
    --marigold:#f6b91d;
    --petal:#ffe07a;
    --moonlight:#f3eeff;
    --muted:#6b5f7d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#fff4d8; --ink:#2b2340; }
  }
  :root[data-theme="dark"]{ --paper:#fff4d8; --ink:#2b2340; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--night); }
  body{ font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif; color:var(--moonlight); -webkit-tap-highlight-color:transparent; }
  *,*::before,*::after{ box-sizing:inherit; }

  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }

  /* Intro */
  #intro{
    position:fixed; inset:0; display:grid; place-items:center; padding:24px;
    background:radial-gradient(ellipse at 50% 60%, rgba(21,27,56,.25), rgba(21,27,56,.82));
    transition:opacity 1.2s ease; z-index:5;
  }
  #intro.hidden{ opacity:0; pointer-events:none; }
  .intro-inner{ max-width:30rem; text-align:center; }
  .intro-inner h1{
    font-weight:500; font-style:italic; font-size:clamp(2.8rem, 11vw, 5rem);
    line-height:.95; margin:0 0 .35em; letter-spacing:-.01em; color:var(--petal);
    text-shadow:0 0 40px rgba(246,185,29,.35);
  }
  .intro-inner p{ font-size:clamp(1.15rem, 4.2vw, 1.4rem); line-height:1.5; margin:0 auto 1.8em; max-width:26rem; color:var(--moonlight); opacity:.9; }
  .btn{
    font:600 1.25rem/1 "Cormorant Garamond", Georgia, serif; font-style:italic;
    background:var(--marigold); color:#2a1d05; border:0; border-radius:999px;
    padding:.8em 1.6em; cursor:pointer; box-shadow:0 0 0 0 rgba(246,185,29,.5);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .btn:focus-visible, .ghost:focus-visible{ outline:3px solid var(--moonlight); outline-offset:4px; }
  @keyframes breathe{ 0%,100%{ box-shadow:0 0 0 0 rgba(246,185,29,.45);} 50%{ box-shadow:0 0 0 14px rgba(246,185,29,0);} }

  /* HUD */
  #hud{
    position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px; z-index:3; pointer-events:none; opacity:0; transition:opacity 1s;
  }
  #hud.show{ opacity:1; }
  #counter{ font-family:"Caveat", cursive; font-size:1.6rem; color:var(--petal); text-shadow:0 1px 8px rgba(0,0,0,.35); }
  .ghost{
    pointer-events:auto; background:rgba(255,255,255,.12); color:var(--moonlight);
    border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:.45em .95em;
    font:500 1rem/1 "Cormorant Garamond", Georgia, serif; cursor:pointer; backdrop-filter:blur(6px);
  }

  #hint{
    position:fixed; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    text-align:center; font-family:"Caveat", cursive; font-size:1.55rem; color:var(--moonlight);
    text-shadow:0 1px 10px rgba(0,0,0,.5); z-index:3; pointer-events:none; opacity:0; transition:opacity .8s; padding:0 20px;
  }
  #hint.show{ opacity:.95; }

  #finale{
    position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:center; z-index:4; opacity:0; pointer-events:none; transition:opacity 1.2s;
  }
  #finale.show{ opacity:1; pointer-events:auto; }

  /* Nota: una polaroid */
  #note{
    position:fixed; left:50%; top:calc(8% + env(safe-area-inset-top,0px));
    width:min(300px, calc(100vw - 56px));
    transform:translate(-50%, 16px) rotate(-2.5deg); opacity:0; pointer-events:none;
    background:var(--paper); color:var(--ink); border-radius:3px;
    padding:12px 12px 10px; z-index:4;
    box-shadow:0 22px 44px rgba(10,8,30,.45), 0 1px 0 rgba(0,0,0,.06);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.2);
  }
  #note::before{
    content:""; position:absolute; top:-11px; left:50%; width:74px; height:22px;
    transform:translateX(-50%) rotate(3deg); background:rgba(246,185,29,.6); border-radius:2px;
  }
  #note.show{ opacity:1; transform:translate(-50%, 0) rotate(-2.5deg); pointer-events:auto; }
  #note-img{
    display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#e8dfc6;
    border-radius:1px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  #note .num{ font-family:"Caveat", cursive; font-size:1.05rem; color:var(--muted); margin:10px 0 2px; }
  #note .txt{ font-family:"Caveat", cursive; font-size:1.6rem; line-height:1.12; margin:0 0 8px; font-weight:500; }
  #note .tap{ font-size:.9rem; font-style:italic; color:var(--muted); margin:0; text-align:right; }
  @media (max-height:700px){
    #note{ width:min(260px, calc(100vw - 56px)); }
    #note .txt{ font-size:1.4rem; }
  }

  /* Carta */
  #letter{
    position:fixed; inset:0; z-index:6; display:grid; place-items:center; padding:20px;
    background:rgba(40,28,10,.35); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .9s;
  }
  #letter.show{ opacity:1; pointer-events:auto; }
  .paper{
    width:min(560px, 100%); max-height:calc(100% - 20px); overflow-y:auto;
    background:var(--paper); color:var(--ink); border-radius:6px;
    padding:clamp(26px, 6vw, 46px); box-shadow:0 30px 70px rgba(30,20,0,.35);
    background-image:linear-gradient(transparent 0 calc(100% - 1px), rgba(246,185,29,.18) 0);
    background-size:100% 2.1rem;
  }
  #letter-img{
    display:block; width:100%; aspect-ratio:3/2; object-fit:cover; margin:0 0 1.2em;
    border-radius:3px; box-shadow:0 10px 24px rgba(30,20,0,.25);
  }
  .paper h2{ font-weight:500; font-style:italic; font-size:clamp(2rem, 8vw, 2.8rem); margin:0 0 .6em; color:#b37a05; line-height:1; }
  .paper p{ font-size:clamp(1.15rem, 4vw, 1.3rem); line-height:1.6; margin:0 0 1em; min-height:1em; }
  .paper .sign{ font-family:"Caveat", cursive; font-size:2rem; text-align:right; margin-top:1.2em; color:#8a5a00; }
  .paper .actions{ display:flex; justify-content:center; margin-top:1.4em; }
  .paper .actions .btn{ animation:none; }
  .caret{ display:inline-block; width:2px; height:1em; background:var(--ink); vertical-align:-.12em; margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    .btn{ animation:none; }
    #note{ transition:opacity .3s; }
  }
</style>
</head>
<body>

<canvas id="garden" aria-label="Jardín nocturno donde puedes plantar flores amarillas"></canvas>

<section id="intro" aria-labelledby="intro-title">
  <div class="intro-inner">
    <h1 id="intro-title">Para ti, <span id="nombre1">mi amor</span></h1>
    <p>Hoy es el Día de las Flores Amarillas y en vez de un ramo te traje un jardín. Todavía está dormido: cada semilla que plantes se vuelve una flor, y cada flor trae algo que quiero decirte.</p>
    <button class="btn" id="start">Entrar al jardín</button>
  </div>
</section>

<header id="hud">
  <div id="counter" aria-live="polite"></div>
  <button class="ghost" id="mute" aria-pressed="false">Silenciar</button>
</header>

<div id="hint" aria-live="polite"></div>

<article id="note" role="dialog" aria-live="polite">
  <img id="note-img" alt="Un recuerdo nuestro">
  <p class="num" id="note-num"></p>
  <p class="txt" id="note-txt"></p>
  <p class="tap">toca para seguir plantando</p>
</article>

<div id="finale"><button class="btn" id="open-letter">Leer tu carta</button></div>

<section id="letter" aria-label="Carta">
  <div class="paper" id="paper">
    <img id="letter-img" alt="Nosotros dos">
    <h2 id="letter-title"></h2>
    <div id="letter-body"></div>
    <p class="sign" id="letter-sign"></p>
    <div class="actions"><button class="btn" id="close-letter">Volver al jardín</button></div>
  </div>
</section>

<script>
(function(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TOTAL = CONFIG.flores.length;

  document.getElementById('nombre1').textContent = CONFIG.nombre;

  const cv = document.getElementById('garden');
  const ctx = cv.getContext('2d');
  let W, H, DPR, groundY;
  let stars = [], fireflies = [], petalsFx = [], flowers = [];
  let phase = 'intro';           // intro | garden | done
  let bloomedCount = 0;          // flores ya abiertas
  let progress = 0;              // 0 noche → 1 día (suavizado)
  let px = 0, py = 0, lastPointer = -1e9;
  let noteOpen = false, pendingNote = null;
  let time = 0;

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const tri = (s, p) => p < .5 ? mix(s[0], s[1], p * 2) : mix(s[1], s[2], (p - .5) * 2);
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const oldGround = groundY;
    groundY = H * 0.72;
    if (oldGround) flowers.forEach(f => { f.y = groundY + f.depth * (H - groundY - 30) + 12; });
    stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: Math.random() * W, y: Math.random() * groundY * 0.9, r: Math.random() * 1.3 + .3, ph: Math.random() * 6.28
    }));
    if (!fireflies.length) {
      fireflies = Array.from({ length: 26 }, () => ({
        x: Math.random() * W, y: groundY - Math.random() * H * 0.35, ph: Math.random() * 6.28, sp: .3 + Math.random() * .6
      }));
    }
    px = W / 2; py = H * .3;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Sonido suave (se genera, no se descarga) ---------- */
  let actx = null, muted = false;
  const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5, 1567.98];
  function chime(i){
    if (!actx || muted) return;
    const t0 = actx.currentTime;
    const f = notes[i % notes.length];
    [f, f * 2].forEach((freq, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = k ? 'sine' : 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(k ? .03 : .09, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + 2.2);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 2.3);
    });
  }
  function finaleChord(){ [0, 2, 4, 5].forEach((n, k) => setTimeout(() => chime(n), k * 180)); }

  /* ---------- Flores ---------- */
  const KINDS = ['girasol', 'margarita', 'cempasuchil'];
  function plant(x, y){
    const i = flowers.length;
    const depth = clamp((y - groundY) / (H - groundY - 30));
    const s = (0.75 + depth * 0.55) * clamp(Math.min(W, H) / 700, .75, 1.25);
    flowers.push({
      x, depth, y: groundY + depth * (H - groundY - 30) + 12, s,
      stemH: (H * 0.2 + Math.random() * H * 0.1) * (0.8 + depth * 0.4),
      kind: KINDS[i % KINDS.length], n: i, t: 0, lean: 0, ph: Math.random() * 6.28,
      petals: 13 + Math.floor(Math.random() * 6), announced: false,
      leafSide: Math.random() < .5 ? -1 : 1
    });
    flowers.sort((a, b) => a.y - b.y);
    burst(x, groundY + depth * (H - groundY - 30), 6, true);
  }

  function drawLeaf(x, y, side, size, color){
    if (size <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(side, 1); ctx.rotate(-0.5);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(size * .6, -size * .45, size * 1.2, 0);
    ctx.quadraticCurveTo(size * .6, size * .35, 0, 0); ctx.fill();
    ctx.restore();
  }

  function drawHead(f){
    const R = 26;
    if (f.kind === 'girasol') {
      for (let layer = 0; layer < 2; layer++) {
        ctx.fillStyle = layer ? '#ffd23f' : '#f2a510';
        const n = f.petals, off = layer ? Math.PI / n : 0;
        for (let k = 0; k < n; k++) {
          const a = k / n * Math.PI * 2 + off;
          ctx.save(); ctx.rotate(a); ctx.beginPath();
          ctx.ellipse(R * (layer ? .82 : .95), 0, R * (layer ? .5 : .56), R * .17, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.restore();
        }
      }
      ctx.fillStyle = '#5a3716'; ctx.beginPath(); ctx.arc(0, 0, R * .52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7d5128';
      for (let k = 0; k < 60; k++) {
        const r = Math.sqrt(k / 60) * R * .47, a = k * 2.39996;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    } else if (f.kind === 'margarita') {
      ctx.fillStyle = '#ffe27d';
      const n = 12;
      for (let k = 0; k < n; k++) {
        ctx.save(); ctx.rotate(k / n * Math.PI * 2); ctx.beginPath();
        ctx.ellipse(R * .7, 0, R * .62, R * .15, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = '#fff1b8';
      for (let k = 0; k < n; k++) {
        ctx.save(); ctx.rotate(k / n * Math.PI * 2 + .12); ctx.beginPath();
        ctx.ellipse(R * .55, 0, R * .35, R * .05, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = '#e8940f'; ctx.beginPath(); ctx.arc(0, 0, R * .3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9740a'; ctx.beginPath(); ctx.arc(-R * .07, -R * .07, R * .12, 0, Math.PI * 2); ctx.fill();
    } else {
      const rings = [[R * .95, 20, '#f39a17', 7], [R * .72, 16, '#f9b52a', 6.5], [R * .48, 12, '#ffcb45', 6], [R * .24, 7, '#ffe07a', 5]];
      rings.forEach(([rad, n, col, sz], ri) => {
        ctx.fillStyle = col;
        for (let k = 0; k < n; k++) {
          const a = k / n * Math.PI * 2 + ri * .4;
          ctx.beginPath(); ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, sz, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.fillStyle = '#ffe99a'; ctx.beginPath(); ctx.arc(0, 0, R * .16, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFlower(f, dt, sunX, sunY){
    f.t += dt;
    const g = easeOut(clamp(f.t / 1.6));
    const bRaw = clamp((f.t - 1.35) / 1.1);
    const b = bRaw > 0 ? easeBack(bRaw) : 0;
    const h = f.stemH * g;

    // Los girasoles miran hacia ti (o al sol cuando no tocas)
    const recent = time - lastPointer < 3;
    const tx = recent ? px : sunX;
    let target = clamp((tx - f.x) / (W * .45), -1, 1) * .42;
    if (!reduce) target += Math.sin(time * 1.1 + f.ph) * .045;
    f.lean += (target - f.lean) * Math.min(1, dt * 3);

    const topX = f.x + Math.sin(f.lean) * h * .55;
    const topY = f.y - h * Math.cos(f.lean * .6);

    const stemCol = rgb(mix([46, 84, 58], [74, 128, 62], progress));
    ctx.strokeStyle = stemCol; ctx.lineWidth = 4.2 * f.s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(f.x, f.y);
    ctx.quadraticCurveTo(f.x, f.y - h * .55, topX, topY); ctx.stroke();

    const leafCol = rgb(mix([52, 96, 62], [96, 150, 72], progress));
    const lx = lerp(f.x, topX, .12), ly = f.y - h * .32;
    drawLeaf(lx, ly, f.leafSide, 24 * f.s * clamp((g - .3) * 2), leafCol);
    drawLeaf(lerp(f.x, topX, .3), f.y - h * .55, -f.leafSide, 18 * f.s * clamp((g - .55) * 3), leafCol);

    if (b > 0) {
      ctx.save(); ctx.translate(topX, topY); ctx.rotate(f.lean * .8);
      ctx.scale(b * f.s, b * f.s);
      if (progress < .85) {
        const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 70);
        glow.addColorStop(0, `rgba(255,214,90,${.45 * (1 - progress)})`);
        glow.addColorStop(1, 'rgba(255,214,90,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
      }
      drawHead(f);
      ctx.restore();
    } else if (g > .85) {
      ctx.fillStyle = stemCol; ctx.beginPath(); ctx.ellipse(topX, topY, 5 * f.s, 8 * f.s, f.lean, 0, Math.PI * 2); ctx.fill();
    }

    if (bRaw > .55 && !f.announced) {
      f.announced = true;
      bloomedCount++;
      chime(f.n);
      burst(topX, topY, 14);
      queueNote(f.n);
    }
  }

  /* ---------- Pétalos y partículas ---------- */
  function burst(x, y, n, dirt){
    if (reduce) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      petalsFx.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (dirt ? 30 : 60),
        rot: Math.random() * 6, vr: (Math.random() - .5) * 6, size: dirt ? 2 + Math.random() * 2 : 4 + Math.random() * 5,
        life: 1, decay: dirt ? 1.6 : .45 + Math.random() * .3, dirt: !!dirt,
        col: dirt ? '#3e2c1c' : ['#ffd23f', '#f6b91d', '#ffe07a', '#f39a17'][i % 4]
      });
    }
  }
  function rainPetal(){
    petalsFx.push({
      x: Math.random() * W, y: -10, vx: 15 + Math.random() * 25, vy: 30 + Math.random() * 40,
      rot: Math.random() * 6, vr: (Math.random() - .5) * 3, size: 4 + Math.random() * 5, life: 1, decay: .08,
      col: ['#ffd23f', '#f6b91d', '#ffe07a'][Math.floor(Math.random() * 3)], rain: true
    });
  }
  function drawPetals(dt){
    for (let i = petalsFx.length - 1; i >= 0; i--) {
      const p = petalsFx[i];
      if (!p.rain) p.vy += 140 * dt; else p.vx += Math.sin(time * 2 + p.rot) * 8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 20) { petalsFx.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = clamp(p.life * 1.5); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.beginPath();
      if (p.dirt) ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      else ctx.ellipse(0, 0, p.size, p.size * .45, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.restore();
    }
  }

  /* ---------- Escena ---------- */
  const SKY_TOP = [[18, 23, 52], [96, 78, 150], [128, 178, 230]];
  const SKY_BOT = [[46, 38, 86], [246, 164, 112], [255, 228, 158]];
  const HILL_BACK = [[30, 42, 60], [70, 92, 78], [122, 168, 96]];
  const HILL_FRONT = [[20, 32, 42], [52, 80, 58], [88, 140, 74]];

  function hill(base, amp, freq, off, color){
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, base - Math.sin(x * freq + off) * amp - Math.sin(x * freq * 2.3 + off * 2) * amp * .35);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  function drawScene(dt){
    const p = progress;
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, rgb(tri(SKY_TOP, p))); sky.addColorStop(1, rgb(tri(SKY_BOT, p)));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    const sa = clamp(1 - p * 1.7);
    if (sa > 0) {
      stars.forEach(s => {
        ctx.globalAlpha = sa * (.5 + .5 * Math.sin(time * 1.4 + s.ph));
        ctx.fillStyle = '#fff8e0'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    const sunX = W * .76, sunY = lerp(groundY + 70, H * .16, easeOut(p));
    const sg = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 180);
    sg.addColorStop(0, `rgba(255,236,160,${.9 * p})`); sg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, 180, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,214,90,${clamp(p * 1.4)})`; ctx.beginPath(); ctx.arc(sunX, sunY, 38, 0, Math.PI * 2); ctx.fill();

    hill(groundY - 8, H * .04, .004, 1.2, rgb(tri(HILL_BACK, p)));
    hill(groundY + 14, H * .02, .007, 3.1, rgb(tri(HILL_FRONT, p)));

    const fa = clamp(1 - p * 1.3);
    if (fa > 0) {
      fireflies.forEach(f => {
        if (!reduce) { f.x += Math.sin(time * f.sp + f.ph) * .4; f.y += Math.cos(time * f.sp * .8 + f.ph) * .3; }
        const a = fa * (.35 + .65 * Math.max(0, Math.sin(time * 2 * f.sp + f.ph)));
        const gl = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 9);
        gl.addColorStop(0, `rgba(255,236,140,${a})`); gl.addColorStop(1, 'rgba(255,236,140,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, Math.PI * 2); ctx.fill();
      });
    }
    return [sunX, sunY];
  }

  let last = performance.now(), rainAcc = 0;
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
    const target = TOTAL ? bloomedCount / TOTAL : 0;
    progress += (target - progress) * Math.min(1, dt * .9);

    const [sunX, sunY] = drawScene(dt);
    flowers.forEach(f => drawFlower(f, dt, sunX, sunY));

    if (phase === 'done' && !reduce) {
      rainAcc += dt;
      while (rainAcc > .18) { rainAcc -= .18; rainPetal(); }
    }
    drawPetals(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Interfaz ---------- */
  const $ = id => document.getElementById(id);
  const hint = $('hint'), counter = $('counter'), note = $('note');

  function setHint(t){ hint.textContent = t; hint.classList.toggle('show', !!t); }
  function updateCounter(){
    const n = flowers.length;
    counter.textContent = n === 1 ? `1 de ${TOTAL} flores` : `${n} de ${TOTAL} flores`;
  }

  function queueNote(i){ pendingNote = i; showNote(i); }
  function showNote(i){
    $('note-num').textContent = `Flor ${i + 1} de ${TOTAL}`;
    $('note-txt').textContent = CONFIG.flores[i].texto;
    const im = $('note-img');
    if (CONFIG.flores[i].foto) { im.src = CONFIG.flores[i].foto; im.style.display = 'block'; } else { im.style.display = 'none'; }
    note.querySelector('.tap').textContent = i + 1 === TOTAL ? 'toca para ver lo que pasa' : 'toca para seguir plantando';
    note.classList.add('show'); noteOpen = true; setHint('');
  }
  function closeNote(){
    note.classList.remove('show'); noteOpen = false;
    if (bloomedCount >= TOTAL && phase !== 'done') finish();
    else if (flowers.length < TOTAL) setHint('Planta otra semilla');
  }
  function finish(){
    phase = 'done';
    finaleChord();
    setHint('');
    setTimeout(() => $('finale').classList.add('show'), 1400);
    for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * W, H * .3 + Math.random() * H * .3, 16), i * 220);
  }

  $('start').addEventListener('click', () => {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    if (!actx) $('mute').style.display = 'none';
    $('intro').classList.add('hidden');
    $('hud').classList.add('show');
    phase = 'garden'; updateCounter();
    setTimeout(() => setHint('Toca la tierra para plantar una semilla'), 700);
  });

  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted;
    e.currentTarget.textContent = muted ? 'Activar sonido' : 'Silenciar';
    e.currentTarget.setAttribute('aria-pressed', String(muted));
  });

  note.addEventListener('click', closeNote);

  cv.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; lastPointer = time; });
  cv.addEventListener('pointerdown', e => {
    px = e.clientX; py = e.clientY; lastPointer = time;
    if (phase === 'intro') return;
    if (noteOpen) { closeNote(); return; }
    if (phase === 'done' || flowers.length >= TOTAL) { burst(e.clientX, e.clientY, 18); chime(Math.floor(Math.random() * notes.length)); return; }
    let y = e.clientY;
    if (y < groundY + 6) y = groundY + 20 + Math.random() * (H - groundY) * .5;
    let x = clamp(e.clientX, 30, W - 30);
    plant(x, y); updateCounter(); setHint('');
  });

  /* ---------- Carta ---------- */
  let typing = null;
  function openLetter(){
    $('letter-title').textContent = `Para ${CONFIG.nombre}`;
    const li = $('letter-img');
    if (CONFIG.fotoCarta) { li.src = CONFIG.fotoCarta; li.style.display = 'block'; } else { li.style.display = 'none'; }
    const body = $('letter-body'); body.innerHTML = ''; $('letter-sign').textContent = '';
    const ps = CONFIG.carta.map(() => { const p = document.createElement('p'); body.appendChild(p); return p; });
    $('letter').classList.add('show');
    $('paper').scrollTop = 0;
    if (reduce) { ps.forEach((p, i) => p.textContent = CONFIG.carta[i]); $('letter-sign').textContent = CONFIG.firma; return; }
    let pi = 0, ci = 0;
    const caret = document.createElement('span'); caret.className = 'caret';
    clearInterval(typing);
    typing = setInterval(() => {
      if (pi >= ps.length) { clearInterval(typing); caret.remove(); $('letter-sign').textContent = CONFIG.firma; return; }
      const txt = CONFIG.carta[pi];
      ps[pi].textContent = txt.slice(0, ++ci); ps[pi].appendChild(caret);
      if (ci >= txt.length) { pi++; ci = 0; }
    }, 38);
  }
  function skipTyping(){
    if (!typing) return;
    clearInterval(typing); typing = null;
    const ps = $('letter-body').querySelectorAll('p');
    ps.forEach((p, i) => p.textContent = CONFIG.carta[i]);
    $('letter-sign').textContent = CONFIG.firma;
  }
  $('open-letter').addEventListener('click', openLetter);
  $('paper').addEventListener('click', e => { if (e.target.id !== 'close-letter') skipTyping(); });
  $('close-letter').addEventListener('click', () => {
    skipTyping(); $('letter').classList.remove('show');
    $('finale').querySelector('button').textContent = 'Leer tu carta otra vez';
    setHint('Toca el jardín para lanzar pétalos');
  });
})();
</script>
</body>
</html>
